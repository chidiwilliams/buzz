---
name: Snapcraft
on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUZZ_DISABLE_TELEMETRY: true
    outputs:
      snap: ${{ steps.snapcraft.outputs.snap }}
    steps:
      # Ideas from https://github.com/orgs/community/discussions/25678
      - name: Remove unused build tools
        run: |
          sudo apt-get remove -y azure-cli google-cloud-sdk hhvm google-chrome-stable firefox powershell mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          python -m pip cache purge
          # Large preinstalled toolchains this build never uses
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/lib/jvm || true
          sudo docker image prune --all --force || true
      - name: Use the fastest Ubuntu apt mirror
        run: |
          # The runner's default mirror (us-east-2.ec2.archive.ubuntu.com) became
          # extremely slow in Nov 2026 (~190 kB/s instead of ~20 MB/s), which
          # turned a ~16 min snap build into 70+ min. apt only falls back to the
          # next mirror on errors, not on slowness, so probe a few mirrors and put
          # the fastest first. Snapcraft's build-packages and stage-packages both
          # download through the host's apt configuration.
          mirrors_file=/etc/apt/apt-mirrors.txt
          if [ ! -f "$mirrors_file" ]; then
            echo "$mirrors_file not found, keeping default apt sources"
            exit 0
          fi
          echo "=== Current mirrors ==="
          cat "$mirrors_file"

          candidates="
            http://us-east-1.ec2.archive.ubuntu.com/ubuntu/
            http://us-east-2.ec2.archive.ubuntu.com/ubuntu/
            http://azure.archive.ubuntu.com/ubuntu/
            http://archive.ubuntu.com/ubuntu/
            http://mirrors.edge.kernel.org/ubuntu/
          "
          best=""
          best_speed=0
          for mirror in $candidates; do
            speed=$(curl -s -o /dev/null --max-time 15 -w '%{speed_download}' \
              "${mirror}dists/noble/main/binary-amd64/Packages.gz" || true)
            speed=${speed%.*}
            speed=${speed:-0}
            echo "$mirror: $((speed / 1024)) KB/s"
            if [ "$speed" -gt "$best_speed" ]; then
              best=$mirror
              best_speed=$speed
            fi
          done

          if [ -z "$best" ]; then
            echo "No mirror responded, keeping default apt sources"
            exit 0
          fi
          echo "Using $best"
          # Fastest first, then the original entries as fallbacks (in file order)
          { echo "$best"; cut -f1 "$mirrors_file" | grep -v -x -F "$best"; } > /tmp/apt-mirrors.txt
          sudo cp /tmp/apt-mirrors.txt "$mirrors_file"
          echo "=== New mirrors ==="
          cat "$mirrors_file"
      - name: Check available disk space
        run: |
          echo "=== Disk space ==="
          df -h
          echo "=== Memory ==="
          free -h
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Snapcraft and dependencies
        run: |
          set -x
          # Ensure snapd is ready
          sudo systemctl start snapd.socket
          sudo snap wait system seed.loaded

          echo "=== Installing snapcraft ==="
          sudo snap install --classic snapcraft

          echo "=== Installing gnome extension dependencies ==="
          sudo snap install gnome-46-2404 || { echo "Failed to install gnome-46-2404"; sudo journalctl -u snapd --no-pager -n 50; exit 1; }
          sudo snap install gnome-46-2404-sdk || { echo "Failed to install gnome-46-2404-sdk"; sudo journalctl -u snapd --no-pager -n 50; exit 1; }

          echo "=== Installing build-snaps ==="
          sudo snap install --classic astral-uv || { echo "Failed to install astral-uv"; sudo journalctl -u snapd --no-pager -n 50; exit 1; }

          echo "=== Installed snaps ==="
          snap list
      - name: Check disk space before build
        run: df -h
      - name: Build snap
        id: snapcraft
        env:
          SNAPCRAFT_BUILD_ENVIRONMENT: host
        run: |
          sudo -E snapcraft pack --verbose --destructive-mode
          echo "snap=$(ls *.snap)" >> $GITHUB_OUTPUT
      - name: Reclaim space from build artifacts
        run: |
          # In destructive mode snapcraft leaves parts/stage/prime in the tree;
          # the .snap is already packed, so these are safe to drop before install.
          sudo rm -rf parts stage prime
          df -h
      - run: sudo snap install --devmode *.snap
      - run: |
          cd $HOME
          xvfb-run buzz --version
      - uses: actions/upload-artifact@v7
        with:
          name: snap
          path: ${{ steps.snapcraft.outputs.snap }}

  upload-edge:
    runs-on: ubuntu-latest
    needs: [ build ]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: snap
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
          SNAPCRAFT_STORE_AUTH: candid
        with:
          snap: ${{ needs.build.outputs.snap }}
          release: edge

  upload-stable:
    runs-on: ubuntu-latest
    needs: [ build ]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: snap
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
          SNAPCRAFT_STORE_AUTH: candid
        with:
          snap: ${{ needs.build.outputs.snap }}
          release: stable
